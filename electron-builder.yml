appId: com.lattice.app
productName: V-Lattice
copyright: Copyright © 2026 V-Lattice

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

asarUnpack:
  - "**/*.node"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: V-Lattice <lattice@example.com>
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

npmRebuild: true
